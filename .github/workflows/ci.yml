name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  CI_macOS:
    name: Run macOS Tests
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run CI_macOS Scheme
        run: set -o pipefail && xcodebuild clean test -workspace ExpenseManagerApp/ExpenseManagerAppWorkspace.xcworkspace -scheme CI_macOS -destination 'platform=macOS' | xcpretty

  CI_iOS:
    name: Run iOS Tests
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run CI_iOS Scheme
        run: set -o pipefail && xcodebuild clean test -workspace ExpenseManagerApp/ExpenseManagerAppWorkspace.xcworkspace -scheme CI_iOS -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' | xcpretty

